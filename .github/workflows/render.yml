name: Render Shadow Video
on:
  workflow_dispatch:
    inputs:
      image_path:
        description: Repository path to the uploaded source image
        required: true
        type: string
      prompt:
        description: Cinematic scene and motion prompt
        required: true
        type: string
      duration:
        description: Generated clip duration
        required: true
        default: "5"
        type: choice
        options: ["5", "10"]
      title:
        description: Project title
        required: false
        default: "Shadow Video Engine"
        type: string
      narration:
        description: Russian voice-over text (optional)
        required: false
        type: string
      voice:
        description: Russian neural voice
        required: true
        default: "ru-RU-DmitryNeural"
        type: choice
        options: ["ru-RU-DmitryNeural", "ru-RU-SvetlanaNeural", "ru-RU-DariyaNeural"]
      voice_mood:
        description: Voice delivery
        required: false
        default: "normal"
        type: choice
        options: ["normal", "dramatic", "slow"]
      music_path:
        description: Optional repository path to uploaded music
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project and uploaded media
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install render dependencies
        run: pip install -r requirements.txt
      - name: Generate cinematic AI video, Russian voice and final sound mix
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IMAGE_PATH: ${{ inputs.image_path }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_DURATION: ${{ inputs.duration }}
          VIDEO_TITLE: ${{ inputs.title }}
          NARRATION: ${{ inputs.narration }}
          VOICE: ${{ inputs.voice }}
          VOICE_MOOD: ${{ inputs.voice_mood }}
          MUSIC_PATH: ${{ inputs.music_path }}
        run: python render_ai.py
      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: shadow-video-${{ github.run_number }}
          path: output/final-video.mp4
          if-no-files-found: error
          retention-days: 7
